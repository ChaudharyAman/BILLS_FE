<svg width="220" height="220" viewBox="35 15 135 160" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFEFF"></stop>
      <stop offset="100%" stop-color="#A7F3D0"></stop>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Back card -->
  <rect x="60" y="40" width="100" height="130" rx="18" fill="#00000010"></rect>

  <!-- Main card -->
  <rect x="40" y="20" width="100" height="130" rx="18" fill="url(#card)" filter="url(#shadow)"></rect>

  <!-- Top bar -->
  <rect x="55" y="35" width="60" height="12" rx="4" fill="#14B8A6"></rect>

  <!-- Lines -->
  <rect x="55" y="60" width="75" height="8" rx="4" fill="#D1D5DB"></rect>
  <rect x="55" y="75" width="65" height="8" rx="4" fill="#D1D5DB"></rect>
  <rect x="55" y="90" width="45" height="8" rx="4" fill="#D1D5DB"></rect>

  <!-- Paid badge -->
  <circle cx="120" cy="115" r="18" fill="#14B8A6"></circle>

  <path d="M112 115L118 121L128 108" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>

</svg>
